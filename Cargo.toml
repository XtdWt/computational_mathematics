[package]
name = "computational_mathematics"
version = "0.1.0"
edition = "2024"

[lib]
name = "computational_mathematics"
crate-type = ["cdylib"]

[lints.clippy]
needless_return = "allow"
unwrap_used = "allow"
too_many_arguments = "allow"

[dependencies]
nalgebra = "0.33.3"
num-complex = "0.4.6"
rand = "0.10.1"
rand_distr = "0.6.0"
rayon = "1.12.0"

[dependencies.pyo3]
version = "0.28.3"
features = ["abi3-py38", "num-complex"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
